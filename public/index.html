<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFDSP – International Forum of Doctoral Scholars and Professionals</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'media',theme:{extend:{colors:{cr:{DEFAULT:'#991B1B',600:'#B91C1C',900:'#5c0f0f'},navy:{DEFAULT:'#182945',2:'#0f1b33'},coral:'#DD534D',ink:'#2D2D2D'},fontFamily:{serif:['Georgia','Cambria','Times New Roman','serif'],sans:['system-ui','-apple-system','Segoe UI','Roboto','Helvetica Neue','Arial','sans-serif']}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-behavior:smooth}</style>
</head>
<body class="bg-white text-ink font-sans antialiased dark:bg-neutral-900 dark:text-neutral-100"><div id="root"></div>
<script>
const {useState,useEffect}=React,html=htm.bind(React.createElement);
const CATS=[
["Distinguished Fellow","DFDSP","Exceptional achievement; ordinarily 15 years’ relevant experience.",["Doctoral degree (PhD or equivalent) or exceptional professional distinction.","Ordinarily at least 15 years of relevant professional, academic, research or leadership experience.","Outstanding achievements and significant contributions to practice, scholarship, governance, innovation or societal development.","Established record of ethical leadership, integrity and professional excellence.","Recommended or approved by the appropriate IFDSP membership authority."],1000],
["Fellow","FDSP","Doctoral qualification or accomplished professional standing; ordinarily 10 years.",["Recognised doctoral qualification or accomplished professional standing.","Ordinarily at least 10 years of relevant professional, academic, managerial or leadership experience.","Substantial achievements in profession, industry, research or public service.","Meaningful contribution to institutional development, knowledge advancement or professional excellence.","Good professional and ethical standing."],850],
["Senior Member","SMDSP","Doctoral qualification or experienced professional standing; ordinarily 7 years.",["Recognised doctoral qualification or substantial professional experience.","Ordinarily at least 7 years of relevant professional, academic, research, administrative or managerial experience.","Competence, professional maturity and leadership potential.","Record of responsible practice and contribution to organisational or societal development.","Upholds the ethical standards and objectives of IFDSP."],500],
["Full Member","MDSP","Recognised qualifications and ordinarily 3 years’ experience.",["Recognised academic or professional qualifications relevant to your field.","Ordinarily at least 3 years of relevant professional experience.","Active in academia, research, public service, business, industry, consultancy or another recognised profession.","Commitment to professional development, intellectual advancement and ethical practice.","Accepts the constitution, mission and professional standards of IFDSP."],300],
["Doctoral Scholar Member","DSM","Verified enrolment in a doctoral programme.",["Formally enrolled in a recognised doctoral programme (PhD or professional doctorate).","Verifiable evidence of current doctoral enrolment.","Commitment to research, scholarship, innovation and academic excellence.","Willing to take part in scholarly activities, conferences, collaborations and development programmes.","Satisfactory academic and ethical standing."],200],
["Associate Member","ADSP","Emerging or suitably qualified professionals.",["Emerging professional, graduate, researcher, entrepreneur or suitably qualified individual.","Recognised academic qualification, professional certification or demonstrable relevant experience.","Interest in academic advancement, leadership development, networking or multidisciplinary collaboration.","Commitment to continuous learning and professional growth.","Agrees to uphold the values and ethical principles of IFDSP."],150],
["Honorary Fellow","Hon. FDSP","Exceptional distinction and societal contribution; by nomination only.",["Individual of exceptional distinction, outstanding leadership or significant societal influence.","Remarkable contributions to education, research, governance, public service, business, philanthropy, peacebuilding or humanitarian development.","Demonstrable integrity, exemplary character and service to humanity.","May be considered irrespective of holding a doctoral degree.","Nominated and approved through the designated IFDSP honorary fellowship process.","Conferred for exceptional merit; it cannot be obtained through payment of fees."],0],
["Corporate/Institutional Member","CMDSP","Legally established, registered organisation or institution.",["Legally established and duly registered organisation or institution.","Eligible bodies include universities, research institutes, professional associations, corporations, government agencies, NGOs and foundations.","Objectives or activities consistent with the mission and vision of IFDSP.","Interest in partnerships, research collaboration, capacity building or knowledge exchange.","Nominates an authorised representative.","Complies with the applicable institutional membership requirements."],5500],
["Life Member","LFDSP","Qualified Fellow meeting the approved life-membership conditions.",["Ordinarily a qualified Fellow of IFDSP.","Sustained professional distinction, integrity and commitment to the Forum’s objectives.","Satisfies the approved conditions for Life Membership, including any prescribed one-time contribution.","Meaningful professional achievement or contribution to institutional development.","Approval from the appropriate IFDSP membership authority.","Life Membership confers continuing status, subject to the constitution, Code of Ethics and disciplinary provisions."],3000]];
const feeOf=(S,c)=>{if(c==="Honorary Fellow")return "By nomination only";const f=S.fees[c]||{};const p=[f.NGN&&"₦"+Number(f.NGN).toLocaleString(),f.USD&&"$"+Number(f.USD).toLocaleString()].filter(Boolean);return p.length?p.join(" / "):"Fee to be announced"};
const L=(s,t)=>[new Date().toLocaleString()+" — "+t,...s.audit];
const card="rounded-xl border border-neutral-200 bg-white p-6 shadow-sm dark:border-neutral-700 dark:bg-neutral-800";
const btn="inline-flex items-center justify-center rounded-md bg-cr px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-cr-600 focus:outline-none focus:ring-2 focus:ring-cr-600 focus:ring-offset-2";
const btn2="inline-flex items-center justify-center rounded-md border border-cr px-5 py-2.5 text-sm font-semibold text-cr transition hover:bg-cr hover:text-white focus:outline-none focus:ring-2 focus:ring-cr-600 dark:text-red-300 dark:border-red-300";
const inp="mt-1 mb-4 block w-full rounded-md border border-neutral-300 bg-white px-3 py-2 text-sm focus:border-cr focus:outline-none focus:ring-1 focus:ring-cr dark:bg-neutral-900 dark:border-neutral-600";
const Tag=({c="",children})=>html`<span class=${"inline-block rounded-full px-2.5 py-0.5 text-xs font-medium "+(c||"bg-neutral-100 text-neutral-700 dark:bg-neutral-700 dark:text-neutral-200")}>${children}</span>`;
const Head=({k,t,s})=>html`<div class="mb-8"><p class="text-xs font-bold uppercase tracking-widest text-cr dark:text-red-300">${k}</p><h2 class="mt-1 font-serif text-3xl font-bold">${t}</h2>${s&&html`<p class="mt-2 max-w-2xl text-neutral-600 dark:text-neutral-300">${s}</p>`}</div>`;
const Sec=({children,alt})=>html`<section class=${alt?"bg-neutral-100 dark:bg-neutral-800/50":""}><div class="mx-auto max-w-6xl px-5 py-14">${children}</div></section>`;

function Nav({r,user,out}){const[o,setO]=useState(false);const items=[["home","Home"],["about","About"],["membership","Membership"],["programmes","Programmes"],["foundation","Foundation"],["contact","Contact"],["portal","My Portal"]];
return html`<header class="sticky top-0 z-20 border-b border-neutral-200 bg-white/95 backdrop-blur dark:border-neutral-800 dark:bg-neutral-900/95">
<div class="bg-navy px-5 py-1.5 text-xs text-slate-300"><div class="mx-auto flex max-w-6xl justify-between"><span>Suite D61, Efab Plaza, Area 11, Garki, Abuja, Nigeria</span><span class="hidden sm:inline">Incorporated in the State of Delaware, USA</span></div></div>
<div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
<a href="#home" class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-full bg-cr font-serif text-sm font-bold text-white">IF</span><span class="leading-tight"><span class="block font-serif text-lg font-bold text-cr dark:text-red-300">IFDSP</span><span class="hidden text-[11px] text-neutral-500 sm:block">International Forum of Doctoral Scholars and Professionals</span></span></a>
<button class="md:hidden rounded border px-3 py-1 text-sm" onClick=${()=>setO(!o)} aria-label="Menu">Menu</button>
<nav class=${(o?"flex":"hidden")+" absolute left-0 top-full w-full flex-col gap-1 border-b bg-white p-4 md:static md:flex md:w-auto md:flex-row md:items-center md:gap-6 md:border-0 md:p-0 dark:bg-neutral-900"}>
${items.map(([k,l])=>html`<a key=${k} href=${"#"+k} onClick=${()=>setO(false)} class=${"border-b-2 py-1 text-sm font-medium transition "+(r===k?"border-cr text-cr dark:text-red-300":"border-transparent hover:text-cr")}>${l}</a>`)}
${user?html`<button onClick=${out} class="text-sm font-medium hover:text-cr md:ml-2">Log out</button>`:html`<a href="#login" class="text-sm font-medium hover:text-cr md:ml-2">Log in</a>`}<a href="#apply" class="inline-flex items-center justify-center rounded-md bg-coral px-5 py-2.5 text-sm font-semibold text-white transition hover:brightness-110">Join IFDSP</a></nav></div></header>`}

function Footer(){return html`<footer class="bg-navy-2 text-slate-300"><div class="mx-auto grid max-w-6xl gap-8 px-5 py-12 md:grid-cols-3">
<div><p class="font-serif text-xl font-bold text-white">IFDSP</p><p class="mt-2 text-sm">Uniting Intellectual Excellence, Advancing Global Leadership.</p><p class="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-sm">${[["about","About"],["membership","Membership"],["programmes","Programmes"],["foundation","Foundation"],["contact","Contact"],["apply","Apply"]].map(([k,l])=>html`<a key=${k} href=${"#"+k} class="hover:text-white">${l}</a>`)}</p></div>
<div class="text-sm"><p class="mb-2 font-semibold text-white">International Operations</p><p>Suite D61, Efab Plaza, Area 11, Garki, Abuja, Nigeria</p><p class="mt-2">Tel: +234 813 304 4666<br/>WhatsApp: +44 7824 421377</p></div>
<div class="text-sm"><p class="mb-2 font-semibold text-white">Notice</p><p>Designations are institutional membership titles, not academic degrees or statutory licences.</p></div></div>
<div class="border-t border-neutral-700 py-4 text-center text-xs">© IFDSP. All rights reserved. · <a href="#legal" class="underline">Privacy, Terms &amp; Policies</a> · <a href="#admin" class="underline">Admin (demo)</a></div></footer>`}

function Home(){return html`<div>
<section class="relative overflow-hidden bg-gradient-to-br from-navy via-navy to-navy-2 text-white"><div class="mx-auto max-w-6xl px-5 py-24"><div class="mb-6 h-1 w-20 bg-cr-600"></div>
<p class="text-xs font-bold uppercase tracking-[0.25em] text-coral">International · Multidisciplinary · Nonprofit</p>
<h1 class="mt-4 max-w-3xl font-serif text-4xl font-bold leading-tight sm:text-6xl">Uniting Intellectual Excellence, Advancing Global Leadership</h1>
<p class="mt-6 max-w-2xl text-lg text-slate-300">Connecting distinguished minds, empowering global leaders, advancing knowledge and transforming societies.</p>
<div class="mt-8 flex flex-wrap gap-3"><a href="#apply" class="inline-flex rounded-md bg-coral px-6 py-3 text-sm font-semibold text-white hover:brightness-110">Apply for membership</a><a href="#membership" class="inline-flex rounded-md border border-white/60 px-6 py-3 text-sm font-semibold hover:bg-white/10">Explore categories</a></div></div></section>
<div class="mx-auto -mt-8 grid max-w-6xl gap-4 px-5 sm:grid-cols-3 relative">${[["9","Membership categories","text-[#2F5FD0]"],["Manual","Credential assessment","text-[#3FA25F]"],["Secure","Verified payments & records","text-[#E8772E]"]].map(([a,b,c])=>html`<div key=${a} class=${card+" text-center"}><p class=${"font-serif text-3xl font-bold "+c}>${a}</p><p class="text-sm text-neutral-500">${b}</p></div>`)}</div>
<${Sec}><${Head} k="What we do" t="One forum, many pillars" s="Approved programme content will be supplied by the Secretariat before launch."/>
<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${[["Membership & credentials","Recognised designations assessed by the Membership and Credentials Assessment Committee."],["Programmes & events","Conferences, lectures and convenings for scholars and professionals."],["Research & publications","Reports, publications and research opportunities."],["Education & Research Foundation","An internal IFDSP programme division supporting education and research."],["Chapters","Approved regional chapters, listed only when officially chartered."],["Partnerships","Institutional collaboration with universities, industry and civil society."]].map(([t,d],i)=>html`<div key=${t} class=${card+" border-t-4 border-t-cr"}><span class="font-serif text-2xl font-bold text-cr/40">0${i+1}</span><h3 class="mt-1 font-semibold">${t}</h3><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">${d}</p></div>`)}</div><//>
<section class="bg-navy text-white"><div class="mx-auto max-w-6xl px-5 py-14"><p class="text-xs font-bold uppercase tracking-widest text-coral">How it works</p><h2 class="mt-1 mb-8 font-serif text-3xl font-bold">Seven steps from application to member portal</h2>
<ol class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">${[["Choose category","Review the eligibility requirements."],["Complete the form","Personal, academic and professional details."],["Upload documents","Identification, qualifications and experience evidence."],["Review fee & pay","The approved fee is shown; payment is processed securely."],["Credentials assessment","Reviewed by the Membership and Credentials Assessment Committee."],["Receive decision","Email: approved, rejected or more information needed."],["Access member portal","Profile, status, receipts and member services."]].map(([t,d],i)=>html`<li key=${i} class="rounded-lg border border-white/10 bg-white/5 p-4"><span class="flex h-8 w-8 items-center justify-center rounded-full bg-coral text-sm font-bold text-white">${i+1}</span><p class="mt-3 font-semibold">${t}</p><p class="mt-1 text-sm text-slate-300">${d}</p></li>`)}</ol>
<p class="mt-6 text-sm text-slate-400">Payment never replaces credential assessment; membership is granted only on an authorised decision.</p></div></section>
<${Sec}><${Head} k="Why IFDSP" t="Why join the Forum?"/><${Grid} items=${WHY}/><//><${Newsletter}/><section class="bg-cr text-center text-white"><div class="mx-auto max-w-3xl px-5 py-14"><h2 class="font-serif text-3xl font-bold">Ready to join a global community of scholars?</h2><a href="#apply" class="mt-6 inline-flex rounded-md bg-white px-6 py-3 text-sm font-semibold text-cr">Start your application</a></div></section></div>`}

const Band=({k,t,s})=>html`<section class="bg-navy text-white"><div class="mx-auto max-w-6xl px-5 py-14"><div class="mb-5 h-1 w-16 bg-cr-600"></div><p class="text-xs font-bold uppercase tracking-widest text-coral">${k}</p><h1 class="mt-2 font-serif text-4xl font-bold">${t}</h1>${s&&html`<p class="mt-3 max-w-2xl text-slate-300">${s}</p>`}</div></section>`;
const Grid=({items,c})=>html`<div class=${"grid gap-5 sm:grid-cols-2 "+(c||"lg:grid-cols-3")}>${items.map(([t,d])=>html`<div key=${t} class=${card+" border-t-4 border-t-cr"}><h3 class="font-semibold">${t}</h3><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">${d}</p></div>`)}</div>`;
const Faq=({items})=>{const[o,setO]=useState(-1);return html`<div class="divide-y rounded-xl border border-neutral-200 bg-white dark:divide-neutral-700 dark:border-neutral-700 dark:bg-neutral-800">${items.map(([q,a],i)=>html`<div key=${i}><button class="flex w-full justify-between gap-4 px-5 py-4 text-left font-medium" aria-expanded=${o===i} onClick=${()=>setO(o===i?-1:i)}>${q}<span class="text-cr">${o===i?"−":"+"}</span></button>${o===i&&html`<p class="px-5 pb-4 text-sm text-neutral-600 dark:text-neutral-300">${a}</p>`}</div>`)}</div>`};
const Newsletter=()=>{const[e,setE]=useState("");const[ok,setOk]=useState(0);return html`<section class="bg-neutral-100 dark:bg-neutral-800/50"><div class="mx-auto max-w-2xl px-5 py-12 text-center"><h2 class="font-serif text-2xl font-bold">Stay informed</h2><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">Subscribe for announcements, events and publications.</p>${ok?html`<p class="mt-4 font-medium text-green-700" role="status">Thank you — you are subscribed.</p>`:html`<div class="mt-4 flex gap-2"><input type="email" aria-label="Email address" placeholder="Your email address" class=${inp+" !my-0"} value=${e} onChange=${x=>setE(x.target.value)}/><button class=${btn} onClick=${()=>/^\S+@\S+\.\S+$/.test(e)&&setOk(1)}>Subscribe</button></div>`}</div></section>`};
const WHY=[["Recognised designations","Institutional membership titles from Associate Member to Distinguished Fellow, awarded after manual credential assessment."],["A global network","Connect with doctoral scholars and distinguished professionals across disciplines and countries."],["Research & publication","Opportunities to collaborate, contribute to publications and share scholarship."],["Leadership development","Programmes, mentorship and professional capacity building for every career stage."],["Verifiable membership","A digital membership card and online verification of your standing."],["Events & summits","Conferences, symposiums, roundtables, workshops and webinars."]];
function Membership({S}){const[v,setV]=useState("");const[res,setRes]=useState(null);
const chk=()=>api("/verify/"+encodeURIComponent(v.trim())).then(j=>setRes(j.found?j:false)).catch(()=>setRes(false));
return html`<div><${Band} k="Membership & fellowship" t="Join a global community of scholars" s="Nine categories recognise scholarly and professional standing. Every application is assessed manually by the Membership and Credentials Assessment Committee."/>
<${Sec}><${Head} k="Categories" t="Membership categories & designations" s="Fees are shown in US dollars; Naira amounts will be confirmed by the Secretariat. Designations are institutional titles, not academic degrees or statutory licences."/>
<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${CATS.map(c=>html`<div key=${c[0]} class=${card+" flex flex-col"}><div class="flex items-start justify-between gap-2"><h3 class="font-semibold">${c[0]}</h3><${Tag} c="bg-cr text-white">${c[1]}<//></div><p class="mt-3 flex-1 text-sm text-neutral-600 dark:text-neutral-300">${c[2]}</p><details class="mt-3 text-sm"><summary class="cursor-pointer font-medium text-cr dark:text-red-300">Eligibility criteria</summary><ul class="mt-2 list-disc space-y-1 pl-5 text-neutral-600 dark:text-neutral-300">${c[3].map(x=>html`<li key=${x}>${x}</li>`)}</ul></details><p class="mt-4 border-t pt-3 text-sm font-semibold text-cr dark:border-neutral-700 dark:text-red-300">${feeOf(S,c[0])}</p></div>`)}</div>
<div class="mt-8 flex flex-wrap gap-3"><a href="#apply" class=${btn}>Apply for membership</a><a href="#contact" class=${btn2}>Membership enquiries</a></div><//>
<${Sec} alt=${1}><${Head} k="Benefits" t="Why become a member?"/><${Grid} items=${WHY}/><//>
<${Sec}><${Head} k="Verification" t="Verify a member" s="Enter a member ID to confirm current membership."/><div class=${card+" max-w-xl"}><input class=${inp} aria-label="Member ID" placeholder="Member ID, e.g. M-12345" value=${v} onChange=${e=>setV(e.target.value)}/><button class=${btn} onClick=${chk}>Verify</button>${res!==null&&html`<p class="mt-4 text-sm" role="status">${res?`Verified: ${res.name}, ${res.cat} (${CATS.find(c=>c[0]===res.cat)[1]}).`:"No active membership found for that ID."}</p>`}</div><//>
<${Sec} alt=${1}><${Head} k="FAQ" t="Frequently asked questions"/><${Faq} items=${[["Who can apply?","Doctoral scholars, researchers, distinguished professionals, public-sector leaders, corporate executives, emerging leaders and eligible organisations. Each category lists its eligibility on this page."],["What do I need to apply?","Identification, evidence of qualifications and experience, and acceptance of the Constitution, Code of Ethics and Privacy Notice. Required evidence varies by category."],["Does payment guarantee membership?","No. Payment and credential assessment are separate. Membership is granted only when an authorised assessor approves your application."],["How is my application assessed?","The Membership and Credentials Assessment Committee reviews your evidence manually and may ask for more information. You are notified by email and in your portal."],["What does a designation mean?","Designations such as FDSP or MDSP are IFDSP membership titles. They are not academic degrees or statutory licences."],["How do I renew?","Active members receive renewal reminders by email and can renew from their portal, in line with the Membership Terms."]]}/><//></div>`}
function Apply({S,act}){const[st,setSt]=useState(1);const[d,setD]=useState({cat:CATS[0][0],name:"",email:"",country:"",qual:"",inst:"",role:"",bio:"",files:[],dc:[false,false,false,false]});const[err,setErr]=useState("");
const set=k=>e=>setD({...d,[k]:e.target.value});const mine=S.apps.find(a=>a.id===S.mineId);
if(mine)return html`<${Sec}><div class=${card+" max-w-xl"}><h2 class="font-serif text-2xl font-bold">Application ${mine.id} submitted</h2><p class="mt-2 text-sm">Track progress in your portal.</p><a href="#portal" class=${btn+" mt-4"}>Go to My Portal</a></div><//>`;
const next=n=>{setErr("");if(st===2&&(!d.name||!/^\S+@\S+\.\S+$/.test(d.email)))return setErr("Enter your full name and a valid email address.");if(st===4&&d.dc.some(x=>!x))return setErr("All declarations must be accepted.");setSt(n)};
const F=(k,l,t="text")=>html`<label class="block text-sm font-medium">${l}<input type=${t} class=${inp} value=${d[k]} onChange=${set(k)}/></label>`;
return html`<${Sec}><${Head} k="Apply" t="Membership application"/>
<div class="mb-6 flex flex-wrap gap-2">${["Category","Details","Documents","Declarations","Payment"].map((l,i)=>html`<span key=${l} class=${"rounded-full px-3 py-1 text-xs font-medium "+(st===i+1?"bg-cr text-white":st>i+1?"bg-red-100 text-cr":"bg-neutral-100 text-neutral-500 dark:bg-neutral-800")}>${i+1}. ${l}</span>`)}</div>
<div class=${card+" max-w-2xl"}>
${st===1&&html`<label class="block text-sm font-medium">Membership category<select class=${inp} value=${d.cat} onChange=${set("cat")}>${CATS.map(c=>html`<option key=${c[0]}>${c[0]}</option>`)}</select></label><ul class="mb-4 list-disc space-y-1 pl-5 text-sm text-neutral-600 dark:text-neutral-300">${CATS.find(c=>c[0]===d.cat)[3].map(x=>html`<li key=${x}>${x}</li>`)}</ul><p class="mb-4 text-sm font-semibold">Fee: ${feeOf(S,d.cat)}</p>${d.cat==="Honorary Fellow"&&html`<p class="mb-4 rounded-md bg-neutral-100 p-3 text-sm dark:bg-neutral-700">Honorary Fellowship is by nomination only. Please use the contact form to nominate a candidate.</p>`}`}
${st===2&&html`<div>${F("name","Full legal name")}${F("email","Email address","email")}${F("country","Country")}${F("qual","Highest qualification")}${F("inst","Awarding institution / doctoral programme")}${F("role","Current role & organisation")}<label class="block text-sm font-medium">Short biography<textarea rows="3" class=${inp} value=${d.bio} onChange=${set("bio")}></textarea></label></div>`}
${st===3&&html`<div><label class="block text-sm font-medium">Supporting evidence (certificates, ID, CV)<input type="file" multiple class=${inp} onChange=${e=>setD({...d,files:[...e.target.files].map(f=>f.name),fo:[...e.target.files]})}/></label><p class="rounded-md bg-neutral-100 p-3 text-xs dark:bg-neutral-700">Accepted: PDF, JPG, PNG, DOC, DOCX. Up to 5 files, 5 MB each. Files are stored privately and visible only to you and authorised assessors.</p></div>`}
${st===4&&html`<div class="space-y-3">${["the IFDSP Constitution","the Code of Ethics","the Privacy Notice","that all information is accurate"].map((t,i)=>html`<label key=${i} class="flex gap-2 text-sm"><input type="checkbox" checked=${d.dc[i]} onChange=${e=>setD({...d,dc:d.dc.map((v,j)=>j===i?e.target.checked:v)})}/>I accept ${t}</label>`)}</div>`}
${st===5&&html`<div><p class="text-sm">Category</p><p class="font-semibold">${d.cat}</p><p class="mt-3 text-sm">Fee</p><p class="font-serif text-2xl font-bold text-cr dark:text-red-300">${feeOf(S,d.cat)}</p><p class="mt-3 rounded-md bg-neutral-100 p-3 text-xs dark:bg-neutral-700">Online payment is not yet available. The Secretariat will send payment instructions after your application is received. Payment never approves membership.</p></div>`}
${err&&html`<p class="mt-3 text-sm font-medium text-cr-600" role="alert">${err}</p>`}
<div class="mt-6 flex gap-3">${st>1&&html`<button class=${btn2} onClick=${()=>setSt(st-1)}>Back</button>`}${st<5?(d.cat==="Honorary Fellow"?html`<a href="#contact" class=${btn}>Nominate a candidate</a>`:html`<button class=${btn} onClick=${()=>next(st+1)}>Continue</button>`):html`<button class=${btn} onClick=${()=>act.submit(d)}>Submit application</button>`}</div></div><//>`}

function Portal({S,act}){const a=S.apps.find(x=>x.id===S.mineId);const[r,setR]=useState("");
if(!a)return html`<${Sec}><${Head} k="My Portal" t="Welcome"/><p>No application yet. <a class="text-cr underline" href="#apply">Start one</a>.</p><//>`;
const flow=["Submitted","Under review","Approved"];const idx=a.status==="Approved"?2:["Under review","Information required"].includes(a.status)?1:0;
return html`<${Sec}><${Head} k="My Portal" t=${"Application "+a.id}/>
<div class="grid gap-6 lg:grid-cols-3"><div class=${card+" lg:col-span-2"}>
<div class="flex flex-wrap items-center gap-2"><${Tag} c="bg-cr text-white">${a.status}<//><span class="text-sm text-neutral-500">${a.cat}</span></div>
<div class="my-6 flex items-center">${flow.map((s,i)=>html`<div key=${s} class="flex flex-1 items-center"><span class=${"flex h-8 w-8 items-center justify-center rounded-full text-xs font-bold "+(i<=idx?"bg-cr text-white":"bg-neutral-200 text-neutral-500")}>${i+1}</span><span class="ml-2 text-xs">${s}</span>${i<2&&html`<span class=${"mx-2 h-0.5 flex-1 "+(i<idx?"bg-cr":"bg-neutral-200")}></span>`}</div>`)}</div>
${a.status==="Information required"&&html`<div class="rounded-md border-l-4 border-cr bg-red-50 p-4 text-sm text-ink"><b>Action needed:</b> ${a.msgs[a.msgs.length-1]}<input class=${inp+" mt-2"} placeholder="Your response" value=${r} onChange=${e=>setR(e.target.value)}/><button class=${btn} onClick=${()=>act.respond(a.id,r)}>Send response</button></div>`}
${a.status==="Rejected"&&html`<p class="text-sm">Decision: ${a.msgs[a.msgs.length-1]}</p>`}
<h3 class="mt-4 font-semibold">Membership fee</h3><p class="text-sm">Fee: <b>${feeOf(S,a.cat)}</b></p><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">Online payment is not yet available. The Secretariat will contact you with payment instructions.</p></div>
<div>${a.status==="Approved"?html`<div class="rounded-2xl bg-gradient-to-br from-cr to-cr-900 p-6 text-white shadow-lg"><p class="text-xs tracking-widest text-red-200">IFDSP · MEMBER</p><p class="mt-6 font-serif text-2xl font-bold">${a.name}</p><p class="text-sm">${CATS.find(c=>c[0]===a.cat)[1]} · ${a.cat}</p><p class="mt-6 text-xs text-red-200">ID ${a.mid}</p></div>`:html`<div class=${card+" text-sm"}>No membership card or designation is issued until an authorised assessor approves your credentials.</div>`}</div></div><//>`}

function Admin({S,act}){const[sel,setSel]=useState(null);const[m,setM]=useState("");const a=S.apps.find(x=>x.id===sel);const th="px-3 py-2 text-left text-xs font-semibold uppercase text-cr dark:text-red-300";
return html`<${Sec}><${Head} k="Admin (demo)" t="Operations workspace" s="Role-based access, assessor decisions, administrator-managed fees and audit trail."/>
<div class=${card+" overflow-x-auto"}><table class="w-full text-sm"><thead><tr><th class=${th}>Ref</th><th class=${th}>Applicant</th><th class=${th}>Category</th><th class=${th}>Status</th><th class=${th}>Payment</th><th></th></tr></thead><tbody>${S.apps.length?S.apps.map(x=>html`<tr key=${x.id} class="border-t dark:border-neutral-700"><td class="px-3 py-2">${x.id}</td><td class="px-3">${x.name}</td><td class="px-3">${x.cat}</td><td class="px-3">${x.status}</td><td class="px-3">${x.pay}</td><td><button class=${btn2+" !py-1"} onClick=${()=>setSel(x.id)}>Open</button></td></tr>`):html`<tr><td colspan="6" class="px-3 py-6 text-center text-neutral-500">No applications yet.</td></tr>`}</tbody></table></div>
${a&&html`<div class=${card+" mt-6"}><h3 class="font-semibold">${a.id} — ${a.name}</h3><p class="mt-1 text-sm text-neutral-600 dark:text-neutral-300">${a.email} · ${a.country}<br/>${a.qual} — ${a.inst}<br/>${a.role}<br/>Evidence: ${(a.docs||[]).map(d=>html`<a key=${d.id} class="underline" href=${"/api/files/"+d.id}>${d.name}</a> `)}</p><p class="mt-2 text-sm">${a.bio}</p>${a.notes.map((n,i)=>html`<p key=${i} class="text-sm italic">${n}</p>`)}
${a.pay!=="verified"&&html`<p class="mt-3 rounded bg-neutral-100 p-2 text-xs dark:bg-neutral-700">Payment not verified. Approval is a separate credential decision.</p>`}
<input class=${inp+" mt-3"} placeholder="Message / reason for applicant" value=${m} onChange=${e=>setM(e.target.value)}/>
<div class="flex flex-wrap gap-2"><button class=${btn2} onClick=${()=>act.decide(a.id,"Information required",m,setM)}>Request info</button><button class=${btn} onClick=${()=>act.decide(a.id,"Approved",m,setM)}>Approve</button><button class=${btn2} onClick=${()=>act.decide(a.id,"Rejected",m,setM)}>Reject</button></div></div>`}
<h3 class="mt-10 mb-2 font-semibold">Fee configuration</h3><p class="mb-3 text-sm text-neutral-500">No fees pre-filled; launch requires the approved schedule (D-04). Changes are audit-logged.</p>
<div class=${card+" overflow-x-auto"}><table class="w-full text-sm"><thead><tr><th class=${th}>Category</th><th class=${th}>NGN</th><th class=${th}>USD</th></tr></thead><tbody>${CATS.map(c=>html`<tr key=${c[0]} class="border-t dark:border-neutral-700"><td class="px-3 py-1">${c[0]}</td>${["NGN","USD"].map(cu=>html`<td key=${cu} class="px-3"><input type="number" min="0" class=${inp+" !my-1 w-28"} defaultValue=${(S.fees[c[0]]||{})[cu]||""} onBlur=${e=>act.fee(c[0],cu,e.target.value)}/></td>`)}</tr>`)}</tbody></table></div>

<h3 class="mt-10 mb-2 font-semibold">Audit log</h3><div class=${card+" space-y-1 text-xs"}>${S.audit.length?S.audit.map((x,i)=>html`<p key=${i}>${x}</p>`):"No events."}</div><//>`}

const Soon=({t})=>html`<div class="rounded-lg border border-dashed border-neutral-300 p-6 text-center text-sm text-neutral-500 dark:border-neutral-600">${t}</div>`;
function About(){return html`<div><${Band} k="About IFDSP" t="Who we are" s="An independent international multidisciplinary professional, intellectual, educational and research-oriented nonprofit organisation."/>
<${Sec}><${Head} k="Institutional identity" t="The Forum at a glance"/><${Grid} items=${[["Who we are","IFDSP brings together doctoral scholars, distinguished professionals, researchers, public-sector leaders, corporate executives and emerging leaders in one multidisciplinary community."],["Our motto","“Uniting Intellectual Excellence, Advancing Global Leadership.”"],["Legal status & offices","Incorporated in the State of Delaware, USA, with its international operational headquarters at Suite D61, Efab Plaza, Area 11, Garki, Abuja, Nigeria."]]}/><//>
<${Sec} alt=${1}><${Head} k="Direction" t="Vision, mission, values & objectives"/><${Grid} c="lg:grid-cols-2" items=${[["Vision","A world in which doctoral scholars and professionals unite intellectual excellence with ethical leadership to advance knowledge and transform societies."],["Mission","To connect distinguished minds across disciplines and borders, recognise scholarly and professional achievement, promote research and education, and develop leaders who serve society."],["Core values","Intellectual excellence · Integrity and ethical conduct · Global inclusiveness · Collaboration · Service to society."],["Aims & objectives","Assess credentials fairly and transparently; foster research and publication; build leadership capacity; support education through the Foundation; and build international partnerships."],["Institutional philosophy","Knowledge carries responsibility. IFDSP is multidisciplinary by design and values rigour, ethics and practical impact."],["Global mandate","To serve as an international platform where recognised expertise informs leadership, scholarship and social progress."]]}/><//>
<${Sec}><${Head} k="Governing documents" t="Constitution & policies" s="Our conduct is guided by the IFDSP Constitution, Code of Ethics and published policies."/><div class=${card+" max-w-2xl divide-y dark:divide-neutral-700"}>${[["Privacy Notice","legal"],["Terms of Use","legal"],["Membership Terms","legal"],["Refund & Cancellation Policy","legal"],["Constitution, Bylaws & Code of Ethics","contact"]].map(([d,h])=>html`<div key=${d} class="flex items-center justify-between py-3 text-sm"><span class="font-medium">${d}</span><a class="font-medium text-cr underline dark:text-red-300" href=${"#"+h}>${h==="legal"?"Read":"Request a copy"}</a></div>`)}</div><//></div>`}

function Programmes(){return html`<div><${Band} k="Programmes & research" t="Programmes, events & publications" s="Leadership, scholarship and professional development for the IFDSP community."/>
<${Sec}><${Head} k="Programmes & initiatives" t="Building leaders and knowledge"/><${Grid} items=${[["Global leadership development","Programmes that prepare scholars and professionals for international leadership."],["Executive & professional development","Practical training for senior and mid-career professionals."],["Doctoral scholars development","Support for doctoral candidates from research design to career transition."],["Mentorship & career advancement","Structured mentoring across career stages and disciplines."],["Women in leadership","Platforms that advance women’s leadership in academia and the professions."],["Youth & emerging leaders","Opportunities for early-career scholars and professionals."],["Public sector leadership & governance","Dialogue and training on effective, accountable public service."],["Corporate governance & strategy","Insights for boards, executives and entrepreneurs."],["Innovation & sustainable development","Initiatives linking research to sustainable development goals."]]}/><//>
<${Sec} alt=${1}><${Head} k="Conferences & events" t="Convenings for the community"/><${Grid} items=${[["International Annual Conference","Our flagship gathering for members and guests."],["Global Doctoral Scholars Summit","A summit dedicated to doctoral scholars."],["Leadership summits & executive roundtables","High-level dialogue on leadership and governance."],["Research symposiums","Presentation and discussion of current scholarship."],["Seminars & workshops","Focused skills and knowledge sessions."],["Webinars & virtual conferences","Participation from anywhere in the world."]]}/>
<h3 class="mt-10 mb-3 font-semibold">Upcoming events</h3><${Soon} t="No events are scheduled at the moment. Dates, venues and registration will be announced here and by email to subscribers."/><//>
<${Sec}><${Head} k="Research & publications" t="Scholarship and knowledge sharing"/><${Grid} items=${[["Scholarly publications","Research articles, working papers and policy briefs."],["Journals, books & reports","Approved journals, monographs and institutional reports."],["Calls for papers","Open calls will be announced with submission guidelines."],["Research collaboration & grants","Partnerships and funding opportunities for members."]]} c="lg:grid-cols-4"/><//>
<${Sec} alt=${1}><${Head} k="Network" t="Chapters & partnerships" s="Official chapters are listed only once formally approved. Any UN, accreditation or institutional recognition is displayed only after it has been formally granted."/><div class="flex flex-wrap gap-3"><a href="#contact" class=${btn}>Request a chapter</a><a href="#contact" class=${btn2}>Partnership enquiries</a></div><//></div>`}

function Foundation(){return html`<div><${Band} k="Education & Research Foundation" t="Advancing education and public-benefit research" s="The Foundation is an internal programme division of IFDSP, not a separately incorporated organisation."/>
<${Sec}><${Head} k="Mission" t="What the Foundation does" s="To widen access to education, support doctoral and public-benefit research, and develop talent for the benefit of communities."/><${Grid} c="lg:grid-cols-4" items=${[["Scholarships","Support for deserving students and scholars."],["Research grants","Funding for approved research and doctoral research support."],["Educational outreach","Learning opportunities reaching underserved communities."],["Mentorship & talent","Guidance that develops the next generation of leaders."],["Community development","Education-led projects with local impact."],["Social impact","Humanitarian and social initiatives within approved purposes."],["Women & youth empowerment","Opportunities that enable women and young people to lead."],["Impact reporting","Programme results published as initiatives are delivered."]]}/><//>
<${Sec} alt=${1}><${Head} k="Get involved" t="Apply or support"/><div class="grid gap-5 md:grid-cols-2"><div class=${card}><h3 class="font-semibold">Scholarship & grant applications</h3><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">Each programme publishes its eligibility, deadline and application form when it opens. Subscribe to be notified.</p><a href="#contact" class=${btn2+" mt-4"}>Ask about opportunities</a></div><div class=${card}><h3 class="font-semibold">Sponsorship & donations</h3><p class="mt-2 text-sm text-neutral-600 dark:text-neutral-300">To support the Foundation or discuss sponsorship, contact the Secretariat. Contributions are not represented as tax-deductible unless confirmed.</p><a href="#contact" class=${btn+" mt-4"}>Contact the Secretariat</a></div></div><//><${Newsletter}/></div>`}

function Contact(){const[f,setF]=useState({type:"General enquiry",name:"",email:"",msg:""});const[ok,setOk]=useState(false);const[e,setE]=useState("");const s=k=>x=>setF({...f,[k]:x.target.value});
const send=()=>{if(!f.name||!f.msg||!/^\S+@\S+\.\S+$/.test(f.email))return setE("Please complete every field with a valid email address.");setE("");setOk(true)};const h="font-semibold text-cr dark:text-red-300";
return html`<div><${Band} k="Contact" t="Get in touch" s="Our International Secretariat and Nigeria operational office welcome your enquiries."/>
<${Sec}><div class="grid gap-8 lg:grid-cols-3"><div class=${card+" space-y-5 text-sm"}><div><p class=${h}>Nigeria operational office</p><p>Suite D61, Efab Plaza, Area 11, Garki, Abuja, Nigeria</p></div><div><p class=${h}>Telephone</p><a href="tel:+2348133044666" class="underline">+234 813 304 4666</a></div><div><p class=${h}>WhatsApp</p><a href="https://wa.me/447824421377" class="underline" rel="noopener">+44 7824 421377</a></div><div><p class=${h}>Legal domicile</p><p>State of Delaware, USA</p></div></div>
<div class=${card+" lg:col-span-2"}>${ok?html`<div role="status"><h3 class="font-serif text-2xl font-bold">Thank you, ${f.name}</h3><p class="mt-2 text-sm">Your ${f.type.toLowerCase()} has been recorded. (Demo: no email is sent from this prototype.)</p></div>`:html`<div><label class="block text-sm font-medium">Enquiry type<select class=${inp} value=${f.type} onChange=${s("type")}>${["General enquiry","Membership enquiry","Conference enquiry","Institutional partnership","Honorary Fellow nomination","Chapter establishment request"].map(t=>html`<option key=${t}>${t}</option>`)}</select></label><label class="block text-sm font-medium">Full name<input class=${inp} value=${f.name} onChange=${s("name")}/></label><label class="block text-sm font-medium">Email<input type="email" class=${inp} value=${f.email} onChange=${s("email")}/></label><label class="block text-sm font-medium">Message<textarea rows="4" class=${inp} value=${f.msg} onChange=${s("msg")}></textarea></label>${e&&html`<p class="mb-3 text-sm font-medium text-cr-600" role="alert">${e}</p>`}<button class=${btn} onClick=${send}>Send enquiry</button></div>`}</div></div><//></div>`}

function Legal(){const T={"Privacy Notice":["IFDSP collects the identity, contact, qualification and professional information you provide to process applications, manage membership and communicate with you. Access is limited to authorised staff by role. Supporting documents are held in private storage. We do not store card details; payments are handled by our payment provider. You may ask to access or correct your information through the Secretariat. Retention follows IFDSP’s approved retention schedule."],"Terms of Use":["This website provides information about IFDSP and access to application and member services. Content is provided in good faith and may change. Designations are institutional membership titles, not academic degrees or statutory licences. You agree to provide accurate information and not to misuse the site or attempt unauthorised access."],"Membership Terms":["Membership is granted only on the decision of an authorised assessor under the IFDSP Constitution. Payment of a fee does not guarantee membership. Members must provide accurate information, uphold the Code of Ethics and use designations only as approved. IFDSP may suspend or withdraw membership in accordance with its governing documents."],"Refund & Cancellation":["Fees are shown, with their purpose and any refund conditions, before you pay. Refund eligibility is governed by the policy in force at the time of payment. Duplicate or erroneous payments are reviewed and refunded where verified. Refunds are processed by authorised finance staff to the original payment method. Contact the Secretariat to make a request."],"Cookie Policy":["We use essential cookies and similar storage to keep the site working. Analytics or other optional cookies are used only where permitted and, where required, with your consent. You can control cookies through your browser settings."]};
const[t,setT]=useState("Privacy Notice");return html`<div><${Band} k="Legal" t="Privacy, terms & policies" s="Last reviewed for the 2026 website launch."/><${Sec}><div class="flex flex-wrap gap-2">${Object.keys(T).map(k=>html`<button key=${k} onClick=${()=>setT(k)} class=${"rounded-full px-4 py-1.5 text-sm font-medium "+(t===k?"bg-cr text-white":"bg-neutral-100 dark:bg-neutral-800")}>${k}</button>`)}</div><div class=${card+" mt-6 max-w-3xl"}><h2 class="font-serif text-2xl font-bold">${t}</h2><p class="mt-3 leading-relaxed">${T[t][0]}</p><p class="mt-4 text-sm text-neutral-500">Questions? <a href="#contact" class="underline">Contact the Secretariat</a>.</p></div><//></div>`}
const api=async(p,o={})=>{const r=await fetch("/api"+p,{method:o.method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j};
function Auth({done}){const[m,setM]=useState("login");const[f,setF]=useState({name:"",email:"",password:""});const[e,setE]=useState("");const s=k=>x=>setF({...f,[k]:x.target.value});
const go=async()=>{try{await api(m==="login"?"/login":"/register",{method:"POST",body:f});await done()}catch(x){setE(x.message)}};
return html`<${Sec}><div class=${card+" mx-auto max-w-md"}><h1 class="font-serif text-2xl font-bold">${m==="login"?"Log in":"Create your account"}</h1><p class="mb-4 mt-1 text-sm text-neutral-500">Applicants and members use the same account.</p>
${m==="register"&&html`<label class="block text-sm font-medium">Full name<input class=${inp} value=${f.name} onChange=${s("name")}/></label>`}
<label class="block text-sm font-medium">Email<input type="email" class=${inp} value=${f.email} onChange=${s("email")}/></label>
<label class="block text-sm font-medium">Password${m==="register"?" (10+ characters)":""}<input type="password" class=${inp} value=${f.password} onChange=${s("password")} onKeyDown=${x=>x.key==="Enter"&&go()}/></label>
${e&&html`<p class="mb-3 text-sm font-medium text-cr-600" role="alert">${e}</p>`}<button class=${btn} onClick=${go}>${m==="login"?"Log in":"Create account"}</button>
<p class="mt-4 text-sm">${m==="login"?"New applicant?":"Already registered?"} <button class="font-medium text-cr underline dark:text-red-300" onClick=${()=>{setM(m==="login"?"register":"login");setE("")}}>${m==="login"?"Create an account":"Log in"}</button></p></div><//>`}
function App(){const loc=()=>(location.hash||"#home").slice(1);const[r,setR]=useState(loc());const[S,setS]=useState({fees:{},apps:[],audit:[],mineId:null,payFirst:false,user:null});
const load=async()=>{try{const j=await api("/state");const mine=j.user?j.apps.filter(a=>a.owner===j.user.id).slice(-1)[0]:null;setS({...j,mineId:mine?mine.id:null})}catch(e){}};
useEffect(()=>{load();const f=()=>{setR(loc());scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
const rd=f=>new Promise(res=>{const x=new FileReader();x.onload=()=>res({name:f.name,data:String(x.result).split(",")[1]});x.readAsDataURL(f)});
const fail=e=>alert(e.message);
const act={
submit:async d=>{try{const docs=await Promise.all((d.fo||[]).map(rd));const{fo,dc,files,...rest}=d;await api("/apps",{method:"POST",body:{...rest,docs}});await load();location.hash="portal"}catch(e){fail(e)}},
pay:()=>{},pf:()=>{},
respond:(id,t)=>api(`/apps/${id}/respond`,{method:"POST",body:{text:t}}).then(load).catch(fail),
decide:(id,status,message,setM)=>{if(status!=="Approved"&&!message)return alert("Please enter a message or reason.");api(`/admin/apps/${id}/decide`,{method:"POST",body:{status,message}}).then(()=>{setM("");load()}).catch(fail)},
fee:(category,currency,value)=>api("/admin/fees",{method:"POST",body:{category,currency,value}}).then(load).catch(fail),
logout:()=>api("/logout",{method:"POST"}).then(()=>{setS(s=>({...s,user:null,apps:[],mineId:null,audit:[]}));location.hash="home"})};
let P={home:Home,about:About,membership:Membership,programmes:Programmes,foundation:Foundation,contact:Contact,apply:Apply,portal:Portal,admin:Admin,legal:Legal,login:Auth}[r]||Home;
if(["apply","portal","admin"].includes(r)&&!S.user)P=()=>html`<${Auth} done=${async()=>{await load()}}/>`;
else if(r==="admin"&&S.user.role!=="admin")P=()=>html`<${Sec}><p>This area is for IFDSP administrators.</p><//>`;
else if(r==="login")P=()=>S.user?html`<${Portal} S=${S} act=${act}/>`:html`<${Auth} done=${async()=>{await load();location.hash="portal"}}/>`;
return html`<div><${Nav} r=${r} user=${S.user} out=${act.logout}/><main><${P} S=${S} act=${act}/></main><${Footer}/></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
